name: Collect Blood Data

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run collection script
        run: python python/data_extraction.py

      # Safety net: keep the raw file for 14 days even if the Snowflake load fails
      - name: Upload extract as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blood-data-${{ github.run_id }}
          path: blood_data_*.ndjson.gz
          retention-days: 14
          if-no-files-found: error

      - name: Load into Snowflake
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: python python/load_to_snowflake.py

      - name: Commit and push changes
        run: |
          # Configure git as the github-actions bot
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Data goes to Snowflake now; only the log and reference cache are committed
          git add eraktkosh_stock_log.log master_data.json
          
          # Check if there are any staged changes. If quiet, no changes.
          if git diff --staged --quiet; then
            echo "No changes to commit. Skipping commit step."
          else
            # Create a timestamped commit message and push
            git commit -m "Automated collection: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi

      # Runs after the commit so a model or test failure never blocks saving the data
      - name: Install dbt
        run: pip install dbt-snowflake==1.12.2

      - name: dbt build
        working-directory: dbt
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          DBT_SNOWFLAKE_USER: RAKT_TRANSFORMER_SVC
        run: dbt build --profiles-dir .
