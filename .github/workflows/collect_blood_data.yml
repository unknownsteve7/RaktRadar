name: Collect Blood Data

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run collection script
        run: python python/data_extraction.py
        
      - name: Commit and push changes
        run: |
          # Configure git as the github-actions bot
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add the tracked data files
          git add blood_data.csv eraktkosh_stock_log.log master_data.json
          
          # Check if there are any staged changes. If quiet, no changes.
          if git diff --staged --quiet; then
            echo "No changes to commit. Skipping commit step."
          else
            # Create a timestamped commit message and push
            git commit -m "Automated collection: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
